services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  node-red:
    build:
      context: ./node-red
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - FLOWS=flows.json
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/flows.json:/data/flows.json

volumes:
  mosquitto-data:
  mosquitto-log:
